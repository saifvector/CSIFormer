<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Tactical Deep Navy to Midnight Slate -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Gradient: Cyan to Sapphire Radar Rim -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0080FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Primary Electric Cyan -> Ice White Gradient for 'C' & 'F' -->
    <linearGradient id="cf-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>

    <!-- Secondary Electric Blue Gradient for F Stem & Waves -->
    <linearGradient id="cf-grad-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glowing Wave Gradient -->
    <linearGradient id="wave-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0080FF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soft Glow Filter for High-Res Displays -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Tactical Dark Navy Squircle Background Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#border-grad)" stroke-width="4"/>

  <!-- 2. Subtle Precision Radar Reticle / Grid Markings -->
  <g opacity="0.18" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round">
    <!-- Corner Framing Reticles -->
    <path d="M 64 88 L 64 64 L 88 64" fill="none"/>
    <path d="M 448 88 L 448 64 L 424 64" fill="none"/>
    <path d="M 64 424 L 64 448 L 88 448" fill="none"/>
    <path d="M 448 424 L 448 448 L 424 448" fill="none"/>
    <!-- Subtle Center Crosshair Axis -->
    <line x1="256" y1="40" x2="256" y2="60"/>
    <line x1="256" y1="452" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="60" y2="256"/>
    <line x1="452" y1="256" x2="472" y2="256"/>
  </g>

  <!-- 3. WI-FI CSI RF SIGNAL REFLECTION WAVE ARCS (Integrated Left Aperture) -->
  <g filter="url(#glow-subtle)">
    <!-- Outer CSI Subcarrier Wave Arc (Distant Reflection) -->
    <path d="M 124 138 A 170 170 0 0 0 124 374" fill="none" stroke="#0080FF" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
    
    <!-- Mid CSI Signal Pulse Arc (Intermediate Multipath Reflection) -->
    <path d="M 154 168 A 125 125 0 0 0 154 344" fill="none" stroke="#00F0FF" stroke-width="16" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 4. MONOGRAM SYMBOL: THE DEFENSE-TECH "CF" GEOMETRIC MATRIX -->
  <!-- A. Letter "C" Main Kinetic Body (Angular Geometric Hex Arc) -->
  <g filter="url(#glow)">
    <!-- Main Outer C Stroke -->
    <path d="M 236 136 
             L 174 136 
             L 112 198 
             L 112 314 
             L 174 376 
             L 236 376" 
          fill="none" 
          stroke="url(#cf-grad-primary)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="miter"/>

    <!-- Inner High-Intensity Core Line of C -->
    <path d="M 230 136 
             L 174 136 
             L 112 198 
             L 112 314 
             L 174 376 
             L 230 376" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="miter" 
          opacity="0.9"/>
  </g>

  <!-- B. Letter "F" Interlocking Spatial Vector -->
  <g filter="url(#glow)">
    <!-- Main Vertical Spine of F -->
    <path d="M 284 136 L 284 376" 
          fill="none" 
          stroke="url(#cf-grad-primary)" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Vertical Spine White Core -->
    <path d="M 284 140 L 284 372" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          opacity="0.9"/>

    <!-- Upper Horizontal Beam of F (Forward Directional Vector) -->
    <path d="M 284 136 L 406 136" 
          fill="none" 
          stroke="url(#cf-grad-primary)" 
          stroke-width="36" 
          stroke-linecap="round"/>
    <path d="M 284 136 L 400 136" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          opacity="0.9"/>

    <!-- Mid Horizontal Beam of F (CSI Subcarrier Tier) -->
    <path d="M 284 252 L 372 252" 
          fill="none" 
          stroke="url(#cf-grad-secondary)" 
          stroke-width="32" 
          stroke-linecap="round"/>
    <path d="M 284 252 L 366 252" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="8" 
          stroke-linecap="round" 
          opacity="0.85"/>
  </g>

  <!-- 5. TACTICAL CSI SENSING APERTURE NODES (Precision Vector Accents) -->
  <!-- Upper Right Sensor Node -->
  <circle cx="406" cy="136" r="6" fill="#FFFFFF" filter="url(#glow-subtle)"/>
  <!-- Middle Tier Subcarrier Node -->
  <circle cx="372" cy="252" r="5" fill="#00F0FF" filter="url(#glow-subtle)"/>
  <!-- C Top Anchor Node -->
  <circle cx="236" cy="136" r="5" fill="#00F0FF" filter="url(#glow-subtle)"/>
  <!-- C Bottom Anchor Node -->
  <circle cx="236" cy="376" r="5" fill="#00F0FF" filter="url(#glow-subtle)"/>
  
  <!-- Central Radar Focal Point: Intersection of Spatial Coordinates -->
  <g transform="translate(198, 256)">
    <circle cx="0" cy="0" r="10" fill="#00F0FF" opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
</svg>